name: Publish release

# Deliberate publication only. Trusted publishing removes long-lived write tokens,
# but publishing is irreversible, so this workflow is never a side effect of a push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version expected in package.json (for example 0.5.2)"
        required: true
        type: string
      mode:
        description: "full = npm then MCP Registry; registry-only = resume after npm already succeeded"
        required: true
        default: full
        type: choice
        options:
          - full
          - registry-only
      confirm:
        description: "I intend to publish/resume this release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: freshcontext-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish freshcontext-mcp
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Assert release version alignment
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const expected = process.env.EXPECTED_VERSION;
          const fail = (message) => {
            console.error('::error::' + message);
            process.exit(1);
          };

          if (!/^\d+\.\d+\.\d+$/.test(expected ?? '')) {
            fail('The workflow version input must be an exact x.y.z version.');
          }

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const core = JSON.parse(fs.readFileSync('packages/core/package.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));

          const values = {
            'package.json': pkg.version,
            'package-lock.json root': lock.version,
            'package-lock.json package root': lock.packages?.['']?.version,
            'package-lock.json Core workspace': lock.packages?.['packages/core']?.version,
            'packages/core/package.json': core.version,
            'server.json': server.version,
            'server.json npm package': server.packages?.[0]?.version,
          };

          for (const [surface, version] of Object.entries(values)) {
            if (version !== expected) fail(`${surface} is ${version}; expected ${expected}.`);
          }

          const sourceChecks = [
            ['src/server.ts', `version: "${expected}"`],
            ['src/rest/handler.ts', `SERVICE_VERSION = "${expected}"`],
            ['worker/src/worker.ts', `SERVICE_VERSION = "${expected}"`],
          ];

          for (const [path, needle] of sourceChecks) {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(needle)) fail(`${path} does not carry expected release version ${expected}.`);
          }

          console.log('Release surfaces aligned at', expected);
          NODE

      - name: Refuse an already-published npm version
        if: ${{ inputs.mode == 'full' }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if npm --prefer-online view "freshcontext-mcp@$EXPECTED_VERSION" version --silent >/tmp/existing-version 2>/dev/null; then
            echo "::error::freshcontext-mcp@$EXPECTED_VERSION already exists on npm. Use registry-only mode to resume."
            cat /tmp/existing-version
            exit 1
          fi
          echo "freshcontext-mcp@$EXPECTED_VERSION is not currently published."

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Trust gate
        run: npm run trust:gate

      - name: Inspect publish tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node <<'NODE'
          const fs = require('fs');
          const pack = JSON.parse(fs.readFileSync('/tmp/pack.json', 'utf8'))[0];
          const files = pack.files.map((entry) => entry.path);
          const bad = files.filter((path) =>
            /AUDIT|EVIDENCE|FIXLIST|STATE_MAP|TRUST_ROADMAP|_REVIEW|[.]sql$|^[.]env$|[.]local[.]txt$/i.test(path)
          );
          if (bad.length) {
            console.error('::error::Internal material in npm tarball: ' + bad.join(', '));
            process.exit(1);
          }
          console.log('Tarball clean:', files.length, 'files,', pack.size, 'bytes');
          NODE

      - name: Publish to npm with provenance
        if: ${{ inputs.mode == 'full' }}
        run: npm publish --access public --provenance

      - name: Verify exact npm version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE="freshcontext-mcp"
          URL="https://registry.npmjs.org/$PACKAGE/$EXPECTED_VERSION"

          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 20               -H 'Cache-Control: no-cache'               -H 'Pragma: no-cache'               "$URL?freshcontext_attempt=$attempt" 2>/dev/null)"; then
              if node -e '
                const body = JSON.parse(process.argv[1]);
                const expected = process.argv[2];
                if (body.version !== expected) process.exit(2);
              ' "$body" "$EXPECTED_VERSION"; then
                echo "npm publication verified: $PACKAGE@$EXPECTED_VERSION"
                exit 0
              fi
            fi
            echo "attempt $attempt: exact npm version not visible yet; waiting"
            sleep 10
          done

          echo "::error::npm did not expose exact version $PACKAGE@$EXPECTED_VERSION within 5 minutes."
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Check MCP Registry version
        id: registry_state
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SERVER_NAME: io.github.PrinceGabriel-lgtm/freshcontext
        run: |
          set -euo pipefail
          ENCODED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$SERVER_NAME")"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/$ENCODED_NAME/versions/$EXPECTED_VERSION"

          if body="$(curl -fsS --max-time 20 "$URL" 2>/dev/null)"; then
            if node -e '
              const body = JSON.parse(process.argv[1]);
              const expectedVersion = process.argv[2];
              const expectedName = process.argv[3];
              const server = body.server ?? body;
              if (server.version !== expectedVersion) process.exit(2);
              if (server.name !== expectedName) process.exit(3);
            ' "$body" "$EXPECTED_VERSION" "$SERVER_NAME"; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "MCP Registry already exposes $SERVER_NAME@$EXPECTED_VERSION; publication step will be skipped."
              exit 0
            fi
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "MCP Registry does not yet expose $SERVER_NAME@$EXPECTED_VERSION."

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: ${{ steps.registry_state.outputs.exists != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ steps.registry_state.outputs.exists != 'true' }}
        run: ./mcp-publisher publish server.json

      - name: Verify MCP Registry publication
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SERVER_NAME: io.github.PrinceGabriel-lgtm/freshcontext
        run: |
          set -euo pipefail
          ENCODED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$SERVER_NAME")"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/$ENCODED_NAME/versions/$EXPECTED_VERSION"

          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 20 "$URL" 2>/dev/null)"; then
              if node -e '
                const body = JSON.parse(process.argv[1]);
                const expectedVersion = process.argv[2];
                const expectedName = process.argv[3];
                const server = body.server ?? body;
                if (server.version !== expectedVersion) process.exit(2);
                if (server.name !== expectedName) process.exit(3);
              ' "$body" "$EXPECTED_VERSION" "$SERVER_NAME"; then
                echo "MCP Registry publication verified: $SERVER_NAME@$EXPECTED_VERSION"
                exit 0
              fi
            fi
            echo "attempt $attempt: MCP Registry has not exposed $SERVER_NAME@$EXPECTED_VERSION yet"
            sleep 10
          done

          echo "::error::MCP Registry did not expose $SERVER_NAME@$EXPECTED_VERSION within 5 minutes."
          exit 1
