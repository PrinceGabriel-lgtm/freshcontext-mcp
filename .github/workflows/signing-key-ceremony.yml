name: Ed25519 signing key ceremony

# Generate a production Ed25519 signing keypair WITHOUT the private key ever reaching a
# human, a log, a chat transcript, or the repository.
#
# The E-2 spec's suggested path is "generate locally, base64 it, paste it into the
# dashboard, discard the local copy". That assumes a workstation, and it routes the most
# security-critical value FreshContext will ever hold through a clipboard.
#
# This does it in one pipe instead:
#
#     node scripts/generate-signing-key.mjs | wrangler secret put FC_ED25519_PRIVATE_KEY_B64
#
# The private half exists only in the pipe between two processes on an ephemeral runner.
# It is never assigned to a shell variable, never written to disk, never printed. The
# public half and the derived key_id go to the job summary, because those are meant to be
# published.
#
# This is not a trust expansion: the runner already holds CLOUDFLARE_API_TOKEN, which can
# set Worker secrets anyway. It narrows exposure rather than widening it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to confirm. This creates production key material.'
        required: true
        type: string
      rotating:
        description: 'Rotating an EXISTING key? Read the checklist in the job summary first.'
        required: true
        default: false
        type: boolean

jobs:
  ceremony:
    name: Generate and install the signing key
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: signing-key-ceremony
      cancel-in-progress: false
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Refuse unless explicitly confirmed
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "GENERATE" ]; then
            echo "::error::Confirmation input must be exactly GENERATE. Nothing was done."
            exit 1
          fi
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Variable CLOUDFLARE_ACCOUNT_ID is not set."; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Overwriting a live signing key without first publishing the outgoing public key as
      # retired orphans every verdict ever signed under it — they become unverifiable, and
      # unverifiable is indistinguishable from forged to anyone checking. E-2 §3 puts the
      # retirement step FIRST for exactly this reason, so this refuses to proceed blind.
      - name: Refuse to clobber an existing key unless rotating
        working-directory: worker
        env:
          ROTATING: ${{ inputs.rotating }}
        run: |
          set -euo pipefail
          # secret list returns NAMES only, never values.
          if npx wrangler secret list --format json 2>/dev/null | grep -q "FC_ED25519_PRIVATE_KEY_B64"; then
            echo "A signing key already exists on this Worker."
            if [ "$ROTATING" != "true" ]; then
              echo "::error::FC_ED25519_PRIVATE_KEY_B64 is already set. Re-run with 'rotating' checked, and only after moving the outgoing public key into FC_ED25519_PUBLIC_KEYS_JSON with status retired. Nothing was changed."
              exit 1
            fi
            echo "::warning::Rotating. The OUTGOING public key must already be published as retired in FC_ED25519_PUBLIC_KEYS_JSON, or existing verdicts stop verifying."
          else
            echo "No existing signing key — this is a first install."
          fi

      # The one step that touches key material. stdout of the generator goes straight into
      # wrangler's stdin; nothing in between can observe it.
      - name: Generate the keypair and install the private half as a Worker secret
        id: ceremony
        working-directory: worker
        run: |
          set -euo pipefail
          node ../scripts/generate-signing-key.mjs \
            | npx wrangler secret put FC_ED25519_PRIVATE_KEY_B64
          echo "Private key installed as a Worker secret. It was never written to disk."

      - name: Publish the public half
        env:
          KEY_ID: ${{ steps.ceremony.outputs.key_id }}
          PUBLIC_KEY: ${{ steps.ceremony.outputs.public_key_spki_b64 }}
        run: |
          set -euo pipefail
          {
            echo '## Ed25519 signing key installed'
            echo
            echo 'The private key is now a Worker secret. It was never written to disk, never'
            echo 'assigned to a variable, and appears nowhere in these logs. There is no copy'
            echo 'of it anywhere else — if it is lost, generate a new one and retire this key id.'
            echo
            echo '### Public values — these are meant to be published'
            echo
            echo '```'
            echo "FC_ED25519_KEY_ID=${KEY_ID}"
            echo "FC_ED25519_PUBLIC_KEY_B64=${PUBLIC_KEY}"
            echo '```'
            echo
            echo '### Finish the ceremony'
            echo
            echo '1. Cloudflare dashboard -> Workers -> freshcontext-mcp -> Settings -> Variables and Secrets.'
            echo '   Add both values above as **plain-text variables** (not secrets — they are public).'
            echo '2. Deploy, so the Worker picks them up. Any merge to `main` will do it.'
            echo '3. Confirm the key document serves the new key:'
            echo '   `curl https://freshcontext-mcp.gimmanuel73.workers.dev/.well-known/freshcontext-signing-keys.json`'
            echo '4. Produce a real verdict and verify it offline — see `docs/VERIFYING.md`.'
            echo '   Until a real V4 attestation has verified with `scripts/verify-offline.mjs`,'
            echo '   E-2 is installed but not proven.'
            echo
            echo '### When you later rotate'
            echo
            echo 'Order matters. Move this public key into `FC_ED25519_PUBLIC_KEYS_JSON` with'
            echo '`"status": "retired"` **before** running this workflow again, or every verdict'
            echo 'signed under it becomes unverifiable — and unverifiable looks identical to'
            echo 'forged to anyone checking. Keys are append-only: a retired public key stays'
            echo 'published forever.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Public key and key_id written to the job summary."
